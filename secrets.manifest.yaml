# Declarative inventory of release / maintainer credentials.
# Consumed by scripts/secrets/*.ts — never commit secret values.
#
# Source of truth: GitHub Actions repository secrets on crvouga/mockingbird. There is no
# self-hosted secret store. Anyone with write access to the repo can run every workflow that
# uses them (Release, Verify, Parity, Resolve issues) without ever seeing a value.
#
# Live-parity sandbox keys are not listed here one by one: every env var that a
# packages/service/*/scripts/parity.ts loads (via `loadCredentials({ fields })`), and every name
# .env.example lists under a service heading, is a repo secret of the same name (e.g.
# STRIPE_SECRET_KEY). scripts/secrets/lib.ts discovers them; the Parity workflow maps each one
# it needs into the run. `bun run secrets:doctor` shows what is set.
#
# Locally, the same names go in .env.local (gitignored, auto-loaded by Bun). Nothing local is
# needed to build, test, or run `bun run check`.

repo: crvouga/mockingbird

secrets:
  - id: npm_token
    description: npm granular token that creates brand-new @crvouga packages and attaches Trusted Publishers
    required: false
    github:
      name: NPM_TOKEN
      required: true
    local_env:
      - NPM_TOKEN
    obtain:
      title: npm → Access Tokens → Generate New Token (Granular)
      urls:
        - https://www.npmjs.com/settings/crvouga/tokens/granular-access-tokens/new
        - https://docs.npmjs.com/trusted-publishers
      steps:
        - "Packages and scopes: Read and write, scope @crvouga (so it can create new packages)"
        - "Enable 'Bypass two-factor authentication' so CI can publish and run npm trust"
        - "Existing packages publish via OIDC; this token only bootstraps new ones and deprecations"
    populate:
      env_local: |
        # Not needed locally. Store it straight on GitHub:
      github: |
        bun run release:bootstrap   # prompts without echo, validates with npm, runs gh secret set

  - id: resolve_issues_github_token
    description: Fine-grained GitHub token the Resolve issues workflow pushes branches and opens PRs with
    required: false
    github:
      name: RESOLVE_ISSUES_GITHUB_TOKEN
      required: false
    local_env: []
    obtain:
      title: GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token
      urls:
        - https://github.com/settings/personal-access-tokens/new
      steps:
        - "Repository access: Only select repositories → crvouga/mockingbird"
        - "Repository permissions: Contents, Issues, Pull requests and Actions: Read and write"
        - "Leave Workflows unset, so an agent cannot change a workflow file"
        - "Not the built-in GITHUB_TOKEN: a PR pushed with it never triggers pr.yml, so it never turns green"
    populate:
      env_local: |
        # Not needed locally. Store it straight on GitHub:
      github: |
        bun run secrets set RESOLVE_ISSUES_GITHUB_TOKEN

  - id: anthropic_api_key
    description: Claude API key for the Resolve issues workflow's agents (or set CLAUDE_CODE_OAUTH_TOKEN instead)
    required: false
    github:
      name: ANTHROPIC_API_KEY
      required: false
    local_env: []
    obtain:
      title: Claude Console → API keys
      urls:
        - https://console.anthropic.com/settings/keys
      steps:
        - "Either this or CLAUDE_CODE_OAUTH_TOKEN; the workflow uses whichever is set"
    populate:
      env_local: |
        # Not needed locally. Store it straight on GitHub:
      github: |
        bun run secrets set ANTHROPIC_API_KEY

  - id: claude_code_oauth_token
    description: Claude subscription token for the Resolve issues workflow's agents (or set ANTHROPIC_API_KEY instead)
    required: false
    github:
      name: CLAUDE_CODE_OAUTH_TOKEN
      required: false
    local_env: []
    obtain:
      title: claude setup-token
      urls:
        - https://docs.claude.com/en/docs/claude-code/github-actions
      steps:
        - "Run `claude setup-token` on a machine logged in to a Claude subscription"
        - "Either this or ANTHROPIC_API_KEY; the workflow uses whichever is set"
    populate:
      env_local: |
        # Not needed locally. Store it straight on GitHub:
      github: |
        bun run secrets set CLAUDE_CODE_OAUTH_TOKEN

  - id: gitguardian_api_key
    description: GitGuardian API token (incidents:write) for `pr-ready guardian ignore`
    required: false
    github:
      name: null
      required: false
    local_env:
      - GITGUARDIAN_API_KEY
    obtain:
      title: GitGuardian → API → Personal access tokens
      urls:
        - https://dashboard.gitguardian.com/api/personal-access-tokens
      steps:
        - "Scope: incidents:write"
        - "Only needed to resolve a false-positive incident from the CLI; the dashboard works too"
    populate:
      env_local: |
        # .env.local (gitignored)
        GITGUARDIAN_API_KEY=<token>
      github: |
        # Not a GitHub secret: GitGuardian reports its check through its own GitHub App.

checklists:
  - id: oidc_trusted_publishing
    description: npm Trusted Publishing (OIDC) — required for CI publish of each public package
    required: true
    urls:
      - https://docs.npmjs.com/trusted-publishers
    steps:
      - "Automatic when the NPM_TOKEN repo secret is set: release:publish runs npm trust github for each package"
      - "Manual fallback, per public package: Settings → Trusted Publisher"
      - "Add GitHub Actions publisher"
      - "Organization/user: crvouga"
      - "Repository: mockingbird"
      - "Workflow filename: ci.yml"
      - "Environment: leave empty unless the release job uses one"
      - "Confirm release job has permissions.id-token: write"
      - "Without NPM_TOKEN, seed new packages locally: bun run release:seed"
