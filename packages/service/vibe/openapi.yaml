  "tags": [
    {
      "name": "Reporting",
      "description": "Aggregated delivery, spend, and outcome metrics, plus the purchase events attributed to Vibe campaigns.\n\nReports run asynchronously: create a report, poll it until its status is `READY`, then download it from the signed `download_url`, which is valid for 24 hours. Purchase events are pulled directly and are useful for reconciling Vibe reporting against e-commerce backends.\n\nDate windows are limited to the last 45 days. Reports typically complete within a few minutes — **do not poll more than once every 10 seconds**."
    }
  ],
  "servers": [
    {
      "url": "https://api.vibe.co",
      "description": "Production API"
    }
  ],
  "components": {
    "securitySchemes": {
      "bearer": {
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "type": "http"
      }
    },
    "schemas": {
      "ReportFilter": {
        "type": "object",
        "properties": {
          "dimension": {
            "type": "string",
            "description": "Dimension to filter on",
            "enum": [
              "event_source_id",
              "campaign_id",
              "strategy_id"
            ]
          },
          "values": {
            "minItems": 1,
            "description": "Values to include",
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "dimension"
        ]
      },
      "ReportCreate": {
        "type": "object",
        "properties": {
          "start_date": {
            "type": "string",
            "description": "Minimum date (inclusive) for which to return data",
            "format": "date"
          },
          "end_date": {
            "type": "string",
            "description": "Maximum date (exclusive) for which to return data",
            "format": "date"
          },
          "timezone": {
            "type": "string",
            "description": "Timezone identifier for reported data",
            "enum": [
              "UTC",
              "Europe/Amsterdam",
              "Europe/Berlin",
              "Europe/Helsinki",
              "Europe/Istanbul",
              "Europe/London",
              "Europe/Stockholm",
              "Asia/Seoul",
              "Asia/Shanghai",
              "Asia/Tel_Aviv",
              "America/Denver",
              "America/Los_Angeles",
              "America/New_York",
              "America/Phoenix"
            ],
            "default": "UTC"
          },
          "advertiser_ids": {
            "minItems": 1,
            "description": "Advertisers to include. Must be owned by the tenant.",
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "dimensions": {
            "type": "array",
            "description": "Dimensions to group rows by",
            "items": {
              "type": "string",
              "enum": [
                "impression_date",
                "advertiser_id",
                "advertiser_name",
                "campaign_id",
                "campaign_name",
                "strategy_id",
                "strategy_name",
                "creative_id",
                "creative_name",
                "event_source_id",
                "event_source_platform",
                "purchase_id",
                "screen",
                "channel_name",
                "content_name",
                "geo_region",
                "geo_metro",
                "geo_city",
                "geo_zip",
                "segment_ages",
                "segment_career",
                "segment_educations",
                "segment_estimated_incomes",
                "segment_estimated_net_worth",
                "segment_ethnicity",
                "segment_family_composition",
                "segment_genders",
                "segment_interests",
                "segment_languages",
                "segment_political_status",
                "segment_retargeting",
                "custom_audiences"
              ]
            }
          },
          "metrics": {
            "type": "array",
            "minItems": 1,
            "description": "Metrics to compute",
            "items": {
              "type": "string",
              "enum": [
                "spend",
                "impressions",
                "households",
                "frequency",
                "cpm",
                "completed_views",
                "cost_per_completed_view",
                "view_through_rate",
                "number_of_page_views",
                "cost_per_page_view",
                "number_of_sessions",
                "cost_per_session",
                "number_of_leads",
                "cost_per_lead",
                "installs",
                "cost_per_install",
                "number_of_purchases",
                "cost_per_purchase",
                "amount_of_purchases",
                "number_of_signups",
                "cost_per_signup",
                "number_of_custom_1",
                "cost_per_custom_1",
                "number_of_custom_2",
                "cost_per_custom_2",
                "number_of_custom_3",
                "cost_per_custom_3",
                "roas"
              ]
            }
          },
          "attribution_window": {
            "type": "string",
            "enum": [
              "1h",
              "6h",
              "12h",
              "24h",
              "48h",
              "72h",
              "7 days",
              "30 days"
            ],
            "default": "7 days"
          },
          "granularity": {
            "type": "string",
            "default": "DAY",
            "description": "Time aggregation granularity for rows in the report",
            "enum": [
              "HOUR",
              "DAY",
              "WEEK",
              "MONTH"
            ]
          },
          "filters": {
            "description": "Optional filters, combined with AND",
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ReportFilter"
            }
          },
          "format": {
            "type": "string",
            "enum": [
              "JSON",
              "CSV"
            ],
            "default": "JSON"
          }
        },
        "required": [
          "start_date",
          "end_date",
          "advertiser_ids",
          "metrics"
        ]
      },
      "ReportFailureReason": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "description": "Stable machine-readable error code"
          },
          "message": {
            "type": "string",
            "description": "Human-readable explanation"
          },
          "details": {
            "type": "object",
            "nullable": true,
            "description": "Additional context specific to the failure code"
          }
        },
        "required": [
          "code",
          "message"
        ]
      },
      "Report": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "description": "Stable identifier of the report",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "CREATED",
              "PROCESSING",
              "READY",
              "FAILED"
            ]
          },
          "download_url": {
            "type": [
              "string",
              "null"
            ],
            "format": "uri",
            "description": "Pre-signed URL to download the report. Populated only when status is READY."
          },
          "generated_url_time": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "url_expiration_time": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "failure_reason": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/ReportFailureReason"
              },
              {
                "type": "null"
              }
            ]
          },
          "created_at": {
            "type": "string",
            "description": "Time at which the report was created",
            "format": "date-time"
          },
          "completed_at": {
            "type": [
              "string",
              "null"
            ],
            "description": "Time at which the report reached a terminal state",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "status",
          "created_at"
        ]
      }
    }
  },
  "security": [
    {
      "bearer": []
    }
  ]
}
