  "info": {
    "title": "Vibe Public API",
    "description": "Vibe Public API revision 2026-06-01",
    "version": "2026-06-01",
    "contact": {},
    "x-mockingbird-upstream": {
      "url": "https://developers.vibe.co/reference/createreport-1"
    }
