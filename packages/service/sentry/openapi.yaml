openapi: 3.1.0
info:
  title: Sentry transport and event API
  version: 0.1.0
  x-emulators-upstream:
    note: Hand-authored bounded subset from official Sentry envelope/rate-limit/REST
      docs and Relay c4e9930349068039dd6ecd06cf338c527ee90165; official SDK
      11.4.0 verifies transport.
paths:
  /api/{project}/envelope/:
    post:
      operationId: IngestEnvelope
      summary: Ingest Envelope
      parameters:
        - &a2
          name: project
          in: path
          required: true
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400": &a1
          description: Sentry error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      requestBody:
        required: true
        content:
          application/x-sentry-envelope:
            schema:
              type: string
      x-emulators:
        parity:
          enabled: false
          reason: Envelope byte lengths and mixed binary items require the dedicated
            official SDK and codec acceptance tests.
          safe: false
      security:
        - dsnHeader: []
        - dsnQuery: []
        - {}
  /api/{project}/store/:
    post:
      operationId: StoreEvent
      summary: Store Event
      parameters:
        - *a2
        - name: sentry_key
          in: query
          required: true
          schema:
            type: string
            enum:
              - "00000000000000000000000000000001"
        - name: sentry_version
          in: query
          required: false
          schema:
            type: string
            enum:
              - "7"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  enum:
                    - "00000000000000000000000000000011"
                    - "00000000000000000000000000000022"
                message:
                  type: string
                  enum:
                    - Fixture error
                    - Other fixture
                level:
                  type: string
                  enum:
                    - error
                    - warning
                release:
                  type: string
                  enum:
                    - fixture-release
                type:
                  type: string
                  enum:
                    - error
                    - transaction
                fingerprint:
                  type: array
                  items:
                    type: string
                    enum:
                      - fixture-group
                  maxItems: 2
              required:
                - message
              additionalProperties: true
      x-emulators:
        parity:
          safe: false
      security:
        - dsnHeader: []
        - dsnQuery: []
        - {}
  /api/{project}/minidump/:
    post:
      operationId: IngestMinidump
      summary: Ingest Minidump
      parameters:
        - *a2
      responses:
        "200":
          description: Hyphenated event UUID
          content:
            text/plain:
              schema:
                type: string
                x-emulators-volatile:
                  kind: id
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      x-emulators:
        parity:
          enabled: false
          reason: Native minidump and multipart bodies require the dedicated served binary
            tests.
          safe: false
      security:
        - dsnHeader: []
        - dsnQuery: []
        - {}
  /api/0/projects/{organization}/{project}/events/:
    get:
      operationId: ListProjectEvents
      summary: List Project Events
      parameters:
        - &a3
          name: organization
          in: path
          required: true
          schema:
            type: string
            enum:
              - fixture-org
        - *a2
        - &a4
          name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - &a5
          name: cursor
          in: query
          required: false
          schema:
            type: string
            enum:
              - 0:0:0
              - 0:1:0
              - bad
        - &a6
          name: query
          in: query
          required: false
          schema:
            type: string
            enum:
              - ""
              - is:unresolved
              - is:resolved
              - release:fixture-release
        - name: full
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      security:
        - restToken: []
  /api/0/projects/{organization}/{project}/events/{event}/:
    get:
      operationId: GetProjectEvent
      summary: Get Project Event
      parameters:
        - *a3
        - *a2
        - &a8
          name: event
          in: path
          required: true
          schema:
            type: string
            x-emulators-resource-ref:
              type: Event
              missing: "00000000000000000000000000000000"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      security:
        - restToken: []
  /api/0/projects/{organization}/{project}/issues/:
    get:
      operationId: ListProjectIssues
      summary: List Project Issues
      parameters:
        - *a3
        - *a2
        - *a4
        - *a5
        - *a6
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      security:
        - restToken: []
  /api/0/issues/{issue}/:
    get:
      operationId: GetIssue
      summary: Get Issue
      parameters:
        - &a7
          name: issue
          in: path
          required: true
          schema:
            type: string
            x-emulators-resource-ref:
              type: Issue
              missing: missing-issue
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      security:
        - restToken: []
    put:
      operationId: UpdateIssue
      summary: Update Issue
      parameters:
        - *a7
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - resolved
                    - unresolved
                    - ignored
              required:
                - status
              additionalProperties: true
      x-emulators:
        parity:
          safe: false
      security:
        - restToken: []
  /api/0/organizations/{organization}/issues/{issue}/:
    get:
      operationId: GetOrganizationIssue
      summary: Get Organization Issue
      parameters:
        - *a3
        - *a7
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      security:
        - restToken: []
    put:
      operationId: UpdateOrganizationIssue
      summary: Update Organization Issue
      parameters:
        - *a3
        - *a7
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - resolved
                    - unresolved
                    - ignored
              required:
                - status
              additionalProperties: true
      x-emulators:
        parity:
          safe: false
      security:
        - restToken: []
  /api/0/projects/{organization}/{project}/events/{event}/attachments/:
    get:
      operationId: ListEventAttachments
      summary: List Event Attachments
      parameters:
        - *a3
        - *a2
        - *a8
        - *a4
        - *a5
        - *a6
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      security:
        - restToken: []
  /api/0/projects/{organization}/{project}/events/{event}/attachments/{attachment}/:
    get:
      operationId: GetEventAttachment
      summary: Get Event Attachment
      parameters:
        - *a3
        - *a2
        - *a8
        - name: attachment
          in: path
          required: true
          schema:
            type: string
            x-emulators-resource-ref:
              type: Attachment
              missing: missing-attachment
        - name: download
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "413": *a1
        "429": *a1
        "500": *a1
        "503": *a1
      security:
        - restToken: []
components:
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
        causes:
          type: array
          items:
            type: string
      required:
        - detail
      additionalProperties: true
    IngestResponse:
      type: object
      properties:
        id:
          type: string
          x-emulators-resource:
            type: Event
            identity: true
          x-emulators-volatile:
            kind: id
      additionalProperties: false
    Event:
      type: object
      properties:
        id:
          type: string
          x-emulators-resource:
            type: Event
            identity: true
        eventID:
          type: string
          x-emulators-resource:
            type: Event
            identity: true
        groupID:
          type:
            - string
            - "null"
        projectID:
          type: string
        dateCreated: &a9
          type: string
          x-emulators-volatile:
            kind: timestamp
        dateReceived: *a9
        title:
          type: string
        message:
          type: string
        platform:
          type: string
        type:
          type: string
        tags:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
            required:
              - key
              - value
        entries:
          type: array
          items: &a10
            type: object
            additionalProperties: true
        user:
          type:
            - object
            - "null"
          additionalProperties: true
        metadata: *a10
      required:
        - id
        - eventID
        - projectID
        - dateCreated
        - title
        - message
        - tags
        - entries
      additionalProperties: true
    Issue:
      type: object
      properties:
        id:
          type: string
          x-emulators-resource:
            type: Issue
            identity: true
        shortId:
          type: string
        title:
          type: string
        count:
          type: string
        firstSeen: *a9
        lastSeen: *a9
        status:
          type: string
          enum:
            - unresolved
            - resolved
            - ignored
        level:
          type: string
        project:
          type: object
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string
          required:
            - id
            - slug
            - name
        metadata: *a10
      required:
        - id
        - title
        - count
        - firstSeen
        - lastSeen
        - status
        - project
      additionalProperties: true
    Attachment:
      type: object
      properties:
        id:
          type: string
          x-emulators-resource:
            type: Attachment
            identity: true
        name:
          type: string
        size:
          type: integer
        mimetype:
          type: string
        dateCreated: *a9
        sha1:
          type: string
      required:
        - id
        - name
        - size
        - mimetype
      additionalProperties: true
  securitySchemes:
    restToken:
      type: http
      scheme: bearer
      description: Fixture REST token; defaults to fixture-rest-token.
    dsnHeader:
      type: apiKey
      in: header
      name: X-Sentry-Auth
      description: Sentry sentry_key=<32 hex fixture public key>, sentry_version=7
    dsnQuery:
      type: apiKey
      in: query
      name: sentry_key
      description: 32 hex fixture DSN public key; or self-authenticated envelope dsn.
servers:
  - url: https://sentry.io
