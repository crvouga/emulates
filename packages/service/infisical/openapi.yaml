paths:
  /api/v1/auth/universal-auth/login:
    post:
      operationId: UniversalAuthLogin
      summary: Authenticate a fixture machine identity
      tags:
        - Infisical
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auth"
        "400":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  example: fixture-machine
                  default: fixture-machine
                clientSecret:
                  type: string
                  example: fixture-client-secret
                  default: fixture-client-secret
                organizationSlug: &a1
                  type: string
              required:
                - clientId
                - clientSecret
      x-mockingbird:
        supported: true
        parity:
          safe: false
      security: []
  /api/v1/auth/token/renew:
    post:
      operationId: RenewAccessToken
      summary: Renew an existing machine access token
      tags:
        - Infisical
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auth"
        "400":
          description: Vendor-shaped error
          content:
            application/json:
