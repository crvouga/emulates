        "429":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-mockingbird:
        supported: true
        parity:
          safe: true
    post:
      operationId: CreateSecret
      summary: Create a shared secret at version one
      tags:
        - Infisical
      parameters:
        - *a9
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          description: Vendor-shaped error
          content:
