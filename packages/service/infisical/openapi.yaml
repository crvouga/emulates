        parity:
          safe: false
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        reqId:
          type: string
          x-mockingbird-volatile:
            kind: id
        statusCode:
          type: integer
        message:
          oneOf:
            - *a1
            - type: array
              items:
                type: object
                additionalProperties: true
        error: *a1
      required:
        - reqId
        - statusCode
        - message
        - error
    Secret:
      type: object
      properties:
        id:
          type: string
          x-mockingbird-resource:
            type: secret
            identity: true
        _id: *a1
        workspace: *a1
        environment: *a1
        secretPath: *a1
        version:
          type: integer
          minimum: 1
        type:
          type: string
          enum:
            - shared
        secretKey: *a1
        secretValue: *a1
        secretComment: *a1
        tags:
          type: array
          items:
            type: object
            properties:
              id: *a1
              slug: *a1
              name: *a1
              color: *a1
            required:
              - id
              - slug
              - name
        metadata:
          type: object
          additionalProperties: *a1
        createdAt:
          type: string
          x-mockingbird-volatile:
            kind: timestamp
        updatedAt:
          type: string
          x-mockingbird-volatile:
            kind: timestamp
        secretValueHidden:
          type: boolean
      required:
        - id
        - _id
        - workspace
        - environment
        - secretPath
        - version
        - type
        - secretKey
        - secretValue
        - secretComment
        - tags
        - metadata
        - createdAt
        - updatedAt
        - secretValueHidden
    Auth:
      type: object
      properties:
        accessToken:
          type: string
          x-mockingbird-volatile:
            kind: token
        expiresIn:
          type: integer
          minimum: 0
        accessTokenMaxTTL:
          type: integer
          minimum: 0
        tokenType:
          type: string
          enum:
            - Bearer
      required:
        - accessToken
        - expiresIn
        - accessTokenMaxTTL
        - tokenType
    SecretResponse:
      type: object
      properties:
        secret:
          $ref: "#/components/schemas/Secret"
      required:
        - secret
    SecretList:
      type: object
      properties:
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/Secret"
        imports:
          type: array
          items:
            type: object
            properties:
              secretPath: *a1
              environment: *a1
              folderId: *a1
              secrets:
                type: array
                items:
                  $ref: "#/components/schemas/Secret"
            required:
              - secretPath
              - environment
              - folderId
              - secrets
      required:
        - secrets
