                $ref: "#/components/schemas/Error"
        "500":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken: *a1
              required:
                - accessToken
      x-mockingbird:
        supported: true
        parity:
          safe: false
      security: []
  /api/v3/secrets/raw:
    get:
      operationId: ListSecrets
      summary: List scoped raw secrets; v3 has no pagination envelope
      tags:
        - Infisical
      parameters:
        - &a2
          name: workspaceId
          in: query
          required: false
          schema:
            type: string
            example: fixture-project
            default: fixture-project
        - &a3
          name: workspaceSlug
          in: query
          required: false
          schema: *a1
        - &a4
          name: environment
          in: query
          required: true
          schema:
            type: string
            example: dev
            default: dev
        - &a5
          name: secretPath
          in: query
          required: false
          schema:
            type: string
            example: /
            default: /
        - &a6
          name: viewSecretValue
          in: query
          required: false
          schema:
            type: boolean
        - &a7
          name: expandSecretReferences
          in: query
          required: false
          schema:
            type: boolean
        - &a8
          name: include_imports
          in: query
          required: false
          schema:
            type: boolean
        - name: recursive
          in: query
          required: false
          schema:
            type: boolean
        - name: tagSlugs
          in: query
          required: false
          schema: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretList"
        "400":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-mockingbird:
        supported: true
        parity:
          safe: true
  /api/v3/secrets/raw/{secretName}:
    get:
      operationId: GetSecret
      summary: Get a secret or historical version
      tags:
        - Infisical
      parameters:
        - &a9
          name: secretName
          in: path
          required: true
          schema:
            type: string
            example: ROOT_VALUE
            default: ROOT_VALUE
        - *a2
        - *a3
        - *a4
        - *a5
        - *a6
        - *a7
        - *a8
        - name: version
          in: query
          required: false
          schema:
            type: number
            example: 1
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - shared
              - personal
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Vendor-shaped error
          content:
