                $ref: "#/components/schemas/Error"
        "500":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId: *a1
                projectSlug: *a1
                environment: &a10
                  type: string
                  example: dev
                  default: dev
                secretPath: &a11
                  type: string
                  example: /
                  default: /
                secretValue: *a1
                secretComment: *a1
                type: &a12
                  type: string
                  enum:
                    - shared
                    - personal
                metadata: &a13
                  type: object
                  additionalProperties: *a1
                tagIds: &a14
                  type: array
                  items: *a1
              required:
                - environment
                - secretValue
      x-mockingbird:
        supported: true
        parity:
          safe: false
    patch:
      operationId: UpdateSecret
      summary: Update or rename a shared secret and preserve versions
      tags:
        - Infisical
      parameters:
        - *a9
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Vendor-shaped error
          content:
            application/json:
              schema:
