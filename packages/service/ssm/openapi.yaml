openapi: 3.1.0
info:
  title: Amazon Systems Manager Parameter Store (Emulators subset)
  version: "1.0.0"
  description: AWS protocol transport; README lists the implemented AWS operations.
servers:
  - url: https://ssm.us-east-1.amazonaws.com
paths:
  /:
    post:
      operationId: AwsRpc
      x-emulators: { supported: true, parity: { enabled: false, reason: Use the stateful LocalStack scenario runner. } }
      responses: { "200": { description: AWS protocol response }, "400": { description: AWS protocol error } }
    get:
      operationId: AwsQuery
      x-emulators: { supported: true, parity: { enabled: false, reason: Use the stateful LocalStack scenario runner. } }
      responses: { "200": { description: AWS query response } }
  /{path}:
    parameters:
      - { name: path, in: path, required: true, schema: { type: string } }
    get:
      operationId: AwsRestGet
      x-emulators: { supported: true, parity: { enabled: false, reason: Use the stateful LocalStack scenario runner. } }
      responses: { "200": { description: AWS REST response } }
    put:
      operationId: AwsRestPut
      x-emulators: { supported: true, parity: { enabled: false, reason: Use the stateful LocalStack scenario runner. } }
      responses: { "200": { description: AWS REST response } }
    post:
      operationId: AwsRestPost
      x-emulators: { supported: true, parity: { enabled: false, reason: Use the stateful LocalStack scenario runner. } }
      responses: { "200": { description: AWS REST response } }
    patch:
      operationId: AwsRestPatch
      x-emulators: { supported: true, parity: { enabled: false, reason: Use the stateful LocalStack scenario runner. } }
      responses: { "200": { description: AWS REST response } }
    delete:
      operationId: AwsRestDelete
      x-emulators: { supported: true, parity: { enabled: false, reason: Use the stateful LocalStack scenario runner. } }
      responses: { "200": { description: AWS REST response } }
