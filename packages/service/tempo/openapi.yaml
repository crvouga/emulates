openapi: 3.1.0
info:
  title: Grafana Tempo (Mockingbird subset)
  description: |
    The OTLP/HTTP trace receiver of Tempo's distributor and the query-frontend routes a trace
    reader calls (TraceQL search, trace by id, tag names), over one tenant-scoped store: a test
    exports spans the way its application does and reads them back as its reader does.
  version: '1'
  x-mockingbird-upstream:
    note: Hand-authored from Grafana's Tempo HTTP API reference
      (https://grafana.com/docs/tempo/latest/api_docs/) and Tempo's source at v3.1.0
      (pkg/api/http.go, pkg/tempopb/tempo.proto, modules/frontend); ingest follows OTLP/HTTP
      (https://opentelemetry.io/docs/specs/otlp/#otlphttp). Tempo publishes no OpenAPI document.
servers:
- url: http://localhost:3200
security:
- {}
- bearerAuth: []
- basicAuth: []
paths:
  /v1/traces:
    post:
      operationId: ExportTraces
      summary: OTLP/HTTP trace export (ExportTraceServiceRequest)
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: false
      parameters:
      - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportTraceServiceRequest'
          application/x-protobuf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 'Accepted. JSON requests get `{partialSuccess: {}}`; protobuf requests get an
            empty ExportTraceServiceResponse.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
            application/x-protobuf:
              schema:
                type: string
                format: binary
        '400':
          description: Undecodable payload, or a trace or span id Tempo's distributor refuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcStatus'
            application/x-protobuf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '415':
          description: Neither application/json nor application/x-protobuf
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Ingestion rate limit (RESOURCE_EXHAUSTED; exporters retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcStatus'
            application/x-protobuf:
              schema:
                type: string
                format: binary
        '500':
          description: Internal error (exporters drop the batch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcStatus'
            application/x-protobuf:
              schema:
                type: string
                format: binary
        '503':
          description: Unavailable (exporters retry); also a missing X-Scope-OrgID under
            multi-tenancy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcStatus'
            application/x-protobuf:
              schema:
                type: string
                format: binary
  /api/search:
    get:
      operationId: Search
      summary: Find traces with a TraceQL query
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: q
        in: query
        description: TraceQL. The emulator evaluates one spanset filter of `true`/`false`, attribute
          equality and `&&`; anything else is a 400.
        schema:
          type: string
          enum:
          - '{ }'
          - '{ true }'
          - '{ .user.id = "user-1" }'
          - '{ span.user.id = "user-1" && resource.service.name = "api" }'
          - '{ .session.id = "session-1" && .attempt = 2 }'
          - '{ resource.service.name = "worker" }'
          - '{ .user.id =~ "user-.*" }'
          - '{ status = error }'
          - '{ .user.id = '
          - 'user.id = "user-1"'
      - name: start
        in: query
        description: Unix epoch seconds. With `end`, keeps traces overlapping the window.
        schema:
          type: integer
          minimum: 1499999990
          maximum: 1500000012
      - name: end
        in: query
        description: Unix epoch seconds.
        schema:
          type: integer
          minimum: 1500000008
          maximum: 1500000040
      - name: limit
        in: query
        description: Maximum traces returned. Default 20.
        schema:
          type: integer
          minimum: 1
          maximum: 5
      - name: spss
        in: query
        description: Spans listed per span set. Default 3.
        schema:
          type: integer
          minimum: 1
          maximum: 4
      - name: tags
        in: query
        description: The logfmt tag search that predates TraceQL.
        x-mockingbird-unsupported:
          reason: Only TraceQL search (`q`) is emulated; a `tags` search is refused with a 400.
        schema:
          type: string
      - name: minDuration
        in: query
        x-mockingbird-unsupported:
          reason: A tag-search parameter; refused with a 400.
        schema:
          type: string
      - name: maxDuration
        in: query
        x-mockingbird-unsupported:
          reason: A tag-search parameter; refused with a 400.
        schema:
          type: string
      responses:
        '200':
          description: Matching traces, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/QueryError'
        '500':
          $ref: '#/components/responses/QueryError'
        '503':
          $ref: '#/components/responses/QueryError'
        '504':
          $ref: '#/components/responses/QueryError'
  /api/traces/{traceId}:
    parameters:
    - name: traceId
      in: path
      required: true
      description: Hex trace id. Up to 32 characters; a shorter id is left-padded with zeros.
      schema:
        type: string
        x-mockingbird-resource-ref:
          type: trace
          missing: 00000000000000000000000000000abc
    get:
      operationId: GetTrace
      summary: One trace by id
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: start
        in: query
        description: Unix epoch seconds. Validated; the emulator holds one block, so the window
          does not narrow the lookup.
        schema:
          type: integer
          minimum: 1500000000
          maximum: 1500000020
      - name: end
        in: query
        description: Unix epoch seconds.
        schema:
          type: integer
          minimum: 1500000000
          maximum: 1500000020
      responses:
        '200':
          description: The trace, as Tempo marshals it (`batches`, base64 ids, enum names)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such trace. The body is empty.
        '429':
          $ref: '#/components/responses/QueryError'
        '500':
          $ref: '#/components/responses/QueryError'
        '503':
          $ref: '#/components/responses/QueryError'
        '504':
          $ref: '#/components/responses/QueryError'
  /api/v2/search/tags:
    get:
      operationId: SearchTagsV2
      summary: Attribute names seen, by scope
      x-mockingbird:
        supported: true
        parity:
          enabled: true
          safe: true
      parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: scope
        in: query
        description: One scope, or every scope plus the intrinsics when absent.
        schema:
          type: string
          enum:
          - span
          - resource
          - intrinsic
          - event
          - link
          - instrumentation
          - none
      - name: limit
        in: query
        description: Maximum tag names per scope.
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: start
        in: query
        description: Unix epoch seconds. Validated; the emulator holds one block, so the window
          does not narrow the answer.
        schema:
          type: integer
          minimum: 1500000000
          maximum: 1500000020
      - name: end
        in: query
        description: Unix epoch seconds.
        schema:
          type: integer
          minimum: 1500000000
          maximum: 1500000020
      - name: q
        in: query
        description: A TraceQL filter narrowing the tag names.
        x-mockingbird-unsupported:
          reason: Filtered tag names are not emulated; a non-empty `q` is refused with a 400.
        schema:
          type: string
      responses:
        '200':
          description: Tag names per scope, each list sorted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchTagsV2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/QueryError'
        '500':
          $ref: '#/components/responses/QueryError'
        '503':
          $ref: '#/components/responses/QueryError'
        '504':
          $ref: '#/components/responses/QueryError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
  parameters:
    OrgId:
      name: X-Scope-OrgID
      in: header
      description: Tenant id. Required when multi-tenancy is on, ignored otherwise.
      schema:
        type: string
        enum:
        - tenant-a
        - tenant-b
  responses:
    BadRequest:
      description: The query frontend refused the request; the body is the error text
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: The gateway in front of Tempo refused the credentials (the configured
        response, 401 or 403), or multi-tenancy is on and X-Scope-OrgID is missing (401
        `no org id`)
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema: {}
    QueryError:
      description: A query-path failure; the body is the error text
      content:
        text/plain:
          schema:
            type: string
  schemas:
    AnyValue:
      type: object
      properties:
        stringValue:
          type: string
          enum:
          - user-1
          - user-2
          - session-1
          - api
          - worker
          - GET
        intValue:
          type:
          - string
          - integer
        boolValue:
          type: boolean
        doubleValue:
          type:
          - number
          - string
        bytesValue:
          type: string
        arrayValue:
          type: object
          properties:
            values:
              type: array
              maxItems: 2
              items:
                type: object
                properties:
                  stringValue:
                    type: string
                    maxLength: 12
        kvlistValue:
          type: object
    KeyValue:
      type: object
      properties:
        key:
          type: string
          enum:
          - service.name
          - user.id
          - session.id
          - mutation.id
          - device.id
          - http.method
          - attempt
        value:
          $ref: '#/components/schemas/AnyValue'
    ExportTraceServiceRequest:
      type: object
      properties:
        resourceSpans:
          type: array
          maxItems: 2
          items:
            type: object
            properties:
              resource:
                type: object
                properties:
                  attributes:
                    type: array
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/KeyValue'
              scopeSpans:
                type: array
                maxItems: 2
                items:
                  type: object
                  properties:
                    scope:
                      type: object
                      properties:
                        name:
                          type: string
                          maxLength: 20
                        version:
                          type: string
                          maxLength: 8
                    spans:
                      type: array
                      maxItems: 3
                      items:
                        type: object
                        required:
                        - traceId
                        - spanId
                        - name
                        properties:
                          traceId:
                            type: string
                            pattern: ^[0-9a-f]{31}[1-9a-f]$
                          spanId:
                            type: string
                            pattern: ^[0-9a-f]{15}[1-9a-f]$
                          parentSpanId:
                            type: string
                            pattern: ^[0-9a-f]{15}[1-9a-f]$
                          name:
                            type: string
                            maxLength: 30
                          kind:
                            type: integer
                            minimum: 0
                            maximum: 5
                          startTimeUnixNano:
                            type: string
                            pattern: ^15000000[0-1][0-9]{10}$
                          endTimeUnixNano:
                            type: string
                            pattern: ^15000000[1-2][0-9]{10}$
                          attributes:
                            type: array
                            maxItems: 4
                            items:
                              $ref: '#/components/schemas/KeyValue'
                          events:
                            type: array
                            maxItems: 2
                            items:
                              type: object
                              properties:
                                timeUnixNano:
                                  type: string
                                  pattern: ^15000000[0-1][0-9]{10}$
                                name:
                                  type: string
                                  maxLength: 20
                                attributes:
                                  type: array
                                  maxItems: 2
                                  items:
                                    $ref: '#/components/schemas/KeyValue'
                          status:
                            type: object
                            properties:
                              code:
                                type: integer
                                minimum: 0
                                maximum: 2
                              message:
                                type: string
                                maxLength: 40
    ExportResponse:
      type: object
      properties:
        partialSuccess:
          type: object
    RpcStatus:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    WireKeyValue:
      type: object
      properties:
        key:
          type: string
        value:
          type: object
    SearchSpan:
      type: object
      required:
      - spanID
      properties:
        spanID:
          type: string
          description: 16 hex characters.
          x-mockingbird-volatile:
            kind: id
        name:
          type: string
        startTimeUnixNano:
          type: string
          x-mockingbird-volatile:
            kind: timestamp
        durationNanos:
          type: string
          x-mockingbird-volatile:
            kind: opaque
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/WireKeyValue'
    SpanSet:
      type: object
      properties:
        spans:
          type: array
          items:
            $ref: '#/components/schemas/SearchSpan'
        matched:
          type: integer
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/WireKeyValue'
    TraceSearchMetadata:
      type: object
      properties:
        traceID:
          type: string
          description: Hex, without leading zeros unless `left_pad_trace_ids` is set (so absent
            for the all-zero id).
          x-mockingbird-resource:
            type: trace
            identity: true
          x-mockingbird-volatile:
            kind: id
        rootServiceName:
          type: string
        rootTraceName:
          type: string
        startTimeUnixNano:
          type: string
          description: uint64 nanoseconds as a decimal string.
          x-mockingbird-volatile:
            kind: timestamp
        durationMs:
          type: integer
          x-mockingbird-volatile:
            kind: opaque
        spanSet:
          $ref: '#/components/schemas/SpanSet'
        spanSets:
          type: array
          items:
            $ref: '#/components/schemas/SpanSet'
        serviceStats:
          type: object
          additionalProperties:
            type: object
            properties:
              spanCount:
                type: integer
              errorCount:
                type: integer
    SearchResponse:
      type: object
      required:
      - traces
      properties:
        traces:
          type: array
          items:
            $ref: '#/components/schemas/TraceSearchMetadata'
        metrics:
          type: object
          properties:
            inspectedTraces:
              type: integer
              x-mockingbird-volatile:
                kind: opaque
            inspectedBytes:
              type: string
              x-mockingbird-volatile:
                kind: opaque
            inspectedSpans:
              type: string
              x-mockingbird-volatile:
                kind: opaque
            totalBlocks:
              type: integer
              x-mockingbird-volatile:
                kind: opaque
            completedJobs:
              type: integer
              x-mockingbird-volatile:
                kind: opaque
            totalJobs:
              type: integer
              x-mockingbird-volatile:
                kind: opaque
            totalBlockBytes:
              type: string
              x-mockingbird-volatile:
                kind: opaque
    WireSpan:
      type: object
      required:
      - traceId
      - spanId
      properties:
        traceId:
          type: string
          description: base64 of the 16 id bytes.
          x-mockingbird-volatile:
            kind: id
        spanId:
          type: string
          description: base64 of the 8 id bytes.
          x-mockingbird-volatile:
            kind: id
        traceState:
          type: string
        parentSpanId:
          type: string
          description: base64; absent on a root span.
          x-mockingbird-volatile:
            kind: id
        flags:
          type: integer
        name:
          type: string
        kind:
          type:
          - string
          - integer
          description: SPAN_KIND_INTERNAL, SPAN_KIND_SERVER, …; absent when unspecified, a number
            for a value the enum does not name.
        startTimeUnixNano:
          type: string
          x-mockingbird-volatile:
            kind: timestamp
        endTimeUnixNano:
          type: string
          x-mockingbird-volatile:
            kind: timestamp
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/WireKeyValue'
        droppedAttributesCount:
          type: integer
        events:
          type: array
          items:
            type: object
            properties:
              timeUnixNano:
                type: string
                x-mockingbird-volatile:
                  kind: timestamp
              name:
                type: string
              attributes:
                type: array
                items:
                  $ref: '#/components/schemas/WireKeyValue'
              droppedAttributesCount:
                type: integer
        droppedEventsCount:
          type: integer
        links:
          type: array
          items:
            type: object
            properties:
              traceId:
                type: string
              spanId:
                type: string
              traceState:
                type: string
              attributes:
                type: array
                items:
                  $ref: '#/components/schemas/WireKeyValue'
              droppedAttributesCount:
                type: integer
              flags:
                type: integer
        droppedLinksCount:
          type: integer
        status:
          type: object
          properties:
            message:
              type: string
            code:
              type:
              - string
              - integer
              description: STATUS_CODE_OK or STATUS_CODE_ERROR; absent when unset, a number for a
                value the enum does not name.
    Trace:
      type: object
      properties:
        batches:
          type: array
          items:
            type: object
            properties:
              resource:
                type: object
                properties:
                  attributes:
                    type: array
                    items:
                      $ref: '#/components/schemas/WireKeyValue'
                  droppedAttributesCount:
                    type: integer
              scopeSpans:
                type: array
                items:
                  type: object
                  properties:
                    scope:
                      type: object
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                        attributes:
                          type: array
                          items:
                            $ref: '#/components/schemas/WireKeyValue'
                        droppedAttributesCount:
                          type: integer
                    spans:
                      type: array
                      items:
                        $ref: '#/components/schemas/WireSpan'
                    schemaUrl:
                      type: string
              schemaUrl:
                type: string
    SearchTagsV2Response:
      type: object
      required:
      - scopes
      properties:
        scopes:
          type: array
          items:
            type: object
            required:
            - name
            - tags
            properties:
              name:
                type: string
              tags:
                type: array
                items:
                  type: string
        metrics:
          type: object
          properties:
            inspectedBytes:
              type: string
              x-mockingbird-volatile:
                kind: opaque
            totalJobs:
              type: integer
              x-mockingbird-volatile:
                kind: opaque
            completedJobs:
              type: integer
              x-mockingbird-volatile:
                kind: opaque
            totalBlocks:
              type: integer
              x-mockingbird-volatile:
                kind: opaque
            totalBlockBytes:
              type: string
              x-mockingbird-volatile:
                kind: opaque
