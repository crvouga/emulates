# Non-blocking pull-request checks. Nothing here is a required status check (scripts/pr-ready.ts
# REQUIRED_CHECKS), so a red job informs the PR without holding its merge. Anything that must hold
# a merge belongs in pr.yml instead.
#
#   Lint annotations  Biome's findings as inline annotations on the diff. The blocking lint is
#                     pr.yml's Static job; this only makes its findings readable in the PR.
#   Live parity       parity.yml for each hot service whose dependency graph the PR changes: its
#                     own package or any workspace package it depends on (scripts/ci-plan.ts, from
#                     Turborepo's graph). A service's tier is `mockingbird.parityTier` in its
#                     package.json; warm runs on a schedule and cold only on demand (see
#                     scripts/parity-tiers.ts). It depends on live
#                     vendors (rate limits, outages, drifting sandboxes), so it cannot gate a
#                     merge. Skipped for fork PRs, which get no secrets.
name: Advisory

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parity: ${{ steps.plan.outputs.parity }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - id: plan
        run: bun scripts/ci-plan.ts changes --base HEAD^1

  lint-annotations:
    name: Lint annotations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      - run: bunx biome ci --reporter=github .

  parity:
    name: Live parity
    needs: changes
    if: >-
      needs.changes.outputs.parity != ''
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/parity.yml
    with:
      services: ${{ needs.changes.outputs.parity }}
    secrets: inherit
